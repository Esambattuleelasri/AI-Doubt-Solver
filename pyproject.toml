[project]
name = "ai-doubt-solver"
version = "0.1.0"
description = "AI Doubt Solver Pro API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.36.0",
    "streamlit-option-menu>=0.4.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "openai>=1.30.3",
    "langchain>=0.2.3",
    "langchain-openai>=0.1.8",
    "langchain-community>=0.2.4",
    "langchain-core>=0.2.5",
    "pdfplumber>=0.11.0",
    "PyPDF2>=3.0.1",
    "fpdf2>=2.7.9",
    "Pillow>=10.3.0",
    "plotly>=5.22.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.2",
    "numpy",
    "deep-translator>=1.11.4",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "aiofiles>=23.2.1",
    "markdown>=3.6",
    "pygments>=2.18.0",
    "python-slugify>=8.0.4",
    "pytest"
]

[tool.vercel]
entrypoint = "backend_main:app"

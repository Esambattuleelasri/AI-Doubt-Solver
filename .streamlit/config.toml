# AI Doubt Solver Pro — Streamlit Config
[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
font = "sans serif"

[server]
maxUploadSize = 20
enableCORS = true
enableXsrfProtection = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
